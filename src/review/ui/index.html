<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiMoCode Review</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-yellow: #d29922;
      --accent-purple: #bc8cff;
      --diff-added-bg: #12261e;
      --diff-removed-bg: #2d1215;
      --diff-added-text: #3fb950;
      --diff-removed-text: #f85149;
      --diff-context-text: #8b949e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Header */
    .header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .subtitle { color: var(--text-secondary); font-size: 14px; }
    .actions { display: flex; gap: 8px; }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #238636; color: white; border-color: rgba(240,246,252,0.1); }
    .btn-primary:hover:not(:disabled) { background: #2ea043; }
    .btn-danger { background: #da3633; color: white; border-color: rgba(240,246,252,0.1); }
    .btn-danger:hover:not(:disabled) { background: #f85149; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn-secondary:hover:not(:disabled) { background: #30363d; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-dot.green { background: var(--accent-green); }
    .stat-dot.red { background: var(--accent-red); }
    .stat-dot.yellow { background: var(--accent-yellow); }

    /* File sections */
    .file-section {
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .file-header {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .file-header:hover { background: var(--bg-tertiary); }
    .file-header-left { display: flex; align-items: center; gap: 12px; }
    .file-path { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; color: var(--accent-blue); }
    .file-status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .file-status.added { background: rgba(63,185,80,0.2); color: var(--accent-green); }
    .file-status.deleted { background: rgba(248,81,73,0.2); color: var(--accent-red); }
    .file-status.modified { background: rgba(210,153,34,0.2); color: var(--accent-yellow); }
    .file-status.renamed { background: rgba(188,140,255,0.2); color: var(--accent-purple); }
    .file-expand { color: var(--text-muted); transition: transform 0.2s; }
    .file-section.collapsed .file-expand { transform: rotate(-90deg); }
    .file-section.collapsed .diff-table-wrapper { display: none; }

    /* Diff table */
    .diff-table-wrapper { overflow-x: auto; }
    .diff-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      line-height: 20px;
    }
    .diff-table td { padding: 0; white-space: pre; vertical-align: top; }
    .line-no {
      width: 50px;
      min-width: 50px;
      text-align: right;
      padding: 0 10px;
      color: var(--text-muted);
      user-select: none;
      border-right: 1px solid var(--border);
    }
    .line-content { padding: 0 12px; }
    .diff-line { height: 20px; }
    .diff-line.added { background: var(--diff-added-bg); }
    .diff-line.removed { background: var(--diff-removed-bg); }
    .diff-line.added .line-content { color: var(--diff-added-text); }
    .diff-line.removed .line-content { color: var(--diff-removed-text); }
    .diff-line.context .line-content { color: var(--diff-context-text); }
    .diff-line .line-action {
      width: 30px;
      min-width: 30px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .diff-line:hover .line-action { opacity: 1; }
    .line-action button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }
    .line-action button:hover { color: var(--accent-blue); }

    /* Annotation badge */
    .annotation-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(31,111,235,0.2);
      color: var(--accent-blue);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
    }

    /* Annotation form */
    .annotation-form {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: none;
    }
    .annotation-form.active { display: block; }
    .annotation-form textarea {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
    }
    .annotation-form textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(31,111,235,0.3);
    }
    .form-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-secondary);
    }
    .empty-state h2 { margin-bottom: 12px; color: var(--text-primary); }
    .empty-state p { max-width: 400px; margin: 0 auto; }

    /* Review complete */
    .review-complete {
      padding: 60px 24px;
      text-align: center;
    }
    .review-complete .icon { font-size: 48px; margin-bottom: 16px; }
    .review-complete h2 { margin-bottom: 8px; }
    .review-complete p { color: var(--text-secondary); }

    /* Annotations panel */
    .annotations-panel {
      margin-top: 24px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .annotations-panel .panel-header {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .annotations-list { list-style: none; }
    .annotations-list li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .annotations-list li:last-child { border-bottom: none; }
    .annotation-meta { min-width: 120px; }
    .annotation-file {
      color: var(--accent-blue);
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .annotation-line { color: var(--text-muted); font-size: 12px; }
    .annotation-text { flex: 1; font-size: 14px; }
    .annotation-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
    }
    .annotation-delete:hover { color: var(--accent-red); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>Code Review</h1>
      <span class="subtitle" id="subtitle"></span>
    </div>
    <div class="actions" id="actions">
      <button class="btn btn-primary" onclick="submitApproval(true)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/></svg>
        Approve
      </button>
      <button class="btn btn-danger" onclick="submitApproval(false)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/></svg>
        Request Changes
      </button>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div class="container" id="content">
    <div class="empty-state">Loading review...</div>
  </div>

  <script>
    let sessionId = null;
    let reviewData = null;

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    async function init() {
      sessionId = getQueryParam('session');
      if (!sessionId) {
        document.getElementById('content').innerHTML =
          '<div class="empty-state"><h2>No active review</h2><p>Start a review with the review_start tool.</p></div>';
        return;
      }

      try {
        const res = await fetch('/api/diff?session=' + encodeURIComponent(sessionId));
        reviewData = await res.json();
        if (reviewData.error) {
          document.getElementById('content').innerHTML =
            '<div class="empty-state"><h2>Error</h2><p>' + escapeHtml(reviewData.error) + '</p></div>';
          return;
        }
        document.getElementById('subtitle').textContent = reviewData.diffType || 'uncommitted';
        renderStats(reviewData);
        renderDiff(reviewData);
        renderAnnotations(reviewData.annotations || []);
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="empty-state"><h2>Failed to load review</h2><p>' + escapeHtml(err.message) + '</p></div>';
      }
    }

    function renderStats(data) {
      const files = data.files || [];
      const added = files.filter(f => f.status === 'added').length;
      const modified = files.filter(f => f.status === 'modified').length;
      const deleted = files.filter(f => f.status === 'deleted').length;
      const anns = (data.annotations || []).length;

      document.getElementById('stats-bar').innerHTML =
        '<div class="stat"><span class="stat-dot green"></span> ' + files.length + ' files changed</div>' +
        (added ? '<div class="stat">' + added + ' added</div>' : '') +
        (modified ? '<div class="stat">' + modified + ' modified</div>' : '') +
        (deleted ? '<div class="stat">' + deleted + ' deleted</div>' : '') +
        (anns ? '<div class="stat">' + anns + ' annotations</div>' : '');
    }

    function renderDiff(data) {
      const container = document.getElementById('content');
      const files = data.files || [];
      if (files.length === 0) {
        container.innerHTML = '<div class="empty-state"><h2>No changes</h2><p>There are no changes to review.</p></div>';
        return;
      }

      let html = '';
      for (let i = 0; i < files.length; i++) {
        html += renderFile(files[i], i);
      }

      // Add annotations panel
      html += '<div class="annotations-panel" id="annotations-panel" style="display:none;">' +
        '<div class="panel-header"><span>Annotations</span><span id="annotation-count"></span></div>' +
        '<ul class="annotations-list" id="annotations-list"></ul></div>';

      container.innerHTML = html;
    }

    function renderFile(file, index) {
      const id = 'file-' + index;
      let lineHtml = '';
      let lineOffset = 0;

      for (const hunk of file.hunks) {
        const lines = hunk.content.split('\n');
        for (let j = 0; j < lines.length; j++) {
          const rawLine = lines[j];
          let className = 'context';
          let prefix = ' ';

          if (rawLine.startsWith('+')) {
            className = 'added';
            prefix = '+';
          } else if (rawLine.startsWith('-')) {
            className = 'removed';
            prefix = '-';
          }

          const displayContent = escapeHtml(rawLine.slice(1) || ' ');
          lineHtml += '<tr class="diff-line ' + className + '">' +
            '<td class="line-no">' + (j + hunk.oldStart) + '</td>' +
            '<td class="line-no">' + (j + hunk.newStart) + '</td>' +
            '<td class="line-content">' + escapeHtml(prefix) + displayContent + '</td>' +
            '<td class="line-action"><button onclick="openAnnotation(\'' + escapeAttr(file.path) + '\',' + (j + hunk.newStart) + ')" title="Add comment">+</button></td>' +
            '</tr>';
        }
      }

      return '<div class="file-section" id="' + id + '">' +
        '<div class="file-header" onclick="toggleFile(\'' + id + '\')">' +
        '<div class="file-header-left">' +
        '<span class="file-expand">▼</span>' +
        '<span class="file-path">' + escapeHtml(file.path) + '</span>' +
        '<span class="file-status ' + file.status + '">' + file.status + '</span>' +
        '<span id="badge-' + id + '"></span>' +
        '</div></div>' +
        '<div class="diff-table-wrapper"><table class="diff-table"><tbody>' + lineHtml + '</tbody></table></div>' +
        '<div class="annotation-form" id="form-' + id + '">' +
        '<textarea id="textarea-' + id + '" placeholder="Leave a comment about this change..."></textarea>' +
        '<div class="form-actions">' +
        '<button class="btn btn-secondary btn-sm" onclick="closeAnnotation(\'' + id + '\')">Cancel</button>' +
        '<button class="btn btn-primary btn-sm" onclick="submitAnnotation(\'' + id + '\',\'' + escapeAttr(file.path) + '\')">Comment</button>' +
        '</div></div></div>';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function toggleFile(id) {
      document.getElementById(id).classList.toggle('collapsed');
    }

    function openAnnotation(filePath, lineNumber) {
      // Find the form for this file
      const sections = document.querySelectorAll('.file-section');
      for (const section of sections) {
        if (section.querySelector('.file-path')?.textContent === filePath) {
          const form = section.querySelector('.annotation-form');
          form.classList.add('active');
          form.dataset.filePath = filePath;
          form.dataset.lineNumber = lineNumber;
          form.querySelector('textarea').focus();
          return;
        }
      }
    }

    function closeAnnotation(formId) {
      document.getElementById('form-' + formId).classList.remove('active');
      document.getElementById('textarea-' + formId).value = '';
    }

    async function submitAnnotation(formId, filePath) {
      const form = document.getElementById('form-' + formId);
      const textarea = document.getElementById('textarea-' + formId);
      const text = textarea.value.trim();
      if (!text) return;

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session: sessionId,
            type: 'annotation',
            filePath,
            lineNumber: parseInt(form.dataset.lineNumber || '0'),
            text,
          }),
        });
        if (res.ok) {
          form.classList.remove('active');
          textarea.value = '';
          // Add badge
          const badge = document.getElementById('badge-' + formId);
          if (badge) {
            badge.innerHTML = '<span class="annotation-badge">💬 ' + escapeHtml(text.slice(0, 40)) + '</span>';
          }
          // Refresh annotations
          const data = await fetch('/api/diff?session=' + encodeURIComponent(sessionId)).then(r => r.json());
          renderAnnotations(data.annotations || []);
          renderStats(data);
        }
      } catch (err) {
        alert('Failed to submit annotation: ' + err.message);
      }
    }

    function renderAnnotations(annotations) {
      const panel = document.getElementById('annotations-panel');
      const list = document.getElementById('annotations-list');
      const count = document.getElementById('annotation-count');

      if (!annotations || annotations.length === 0) {
        panel.style.display = 'none';
        return;
      }

      panel.style.display = 'block';
      count.textContent = annotations.length + ' comment' + (annotations.length !== 1 ? 's' : '');

      list.innerHTML = annotations.map(ann =>
        '<li>' +
        '<div class="annotation-meta">' +
        '<div class="annotation-file">' + escapeHtml(ann.filePath) + '</div>' +
        (ann.lineNumber ? '<div class="annotation-line">Line ' + ann.lineNumber + '</div>' : '') +
        '</div>' +
        '<div class="annotation-text">' + escapeHtml(ann.text) + '</div>' +
        '</li>'
      ).join('');
    }

    async function submitApproval(approved) {
      let feedback = '';
      if (!approved) {
        feedback = prompt('Please describe the changes requested:');
        if (feedback === null) return;
      }

      try {
        const res = await fetch('/api/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: sessionId, approved, feedback }),
        });
        if (res.ok) {
          document.getElementById('content').innerHTML =
            '<div class="review-complete">' +
            '<div class="icon">' + (approved ? '✅' : '📝') + '</div>' +
            '<h2>' + (approved ? 'Review Approved' : 'Changes Requested') + '</h2>' +
            '<p>' + (approved ? 'The code changes have been approved.' : 'Your feedback has been sent to the agent.') + '</p>' +
            '</div>';
          document.getElementById('actions').innerHTML =
            '<span style="color: var(--text-secondary);">Review complete</span>';
        }
      } catch (err) {
        alert('Failed to submit: ' + err.message);
      }
    }

    init();
  </script>
</body>
</html>
